# version: '3.8'

services:
  # 1. Banco de Dados (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: tablesync-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: tablesync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tablesync-network

  # 2. Mensageria (RabbitMQ com painel de gestão)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tablesync-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - tablesync-network

  # 3. Distributed Lock / Cache (Redis)
  redis:
    image: redis:7-alpine
    container_name: tablesync-redis
    ports:
      - "6379:6379"
    networks:
      - tablesync-network

  # 4. API Gateway (.NET)
  api-gateway:
    build:
      context: ../../
      dockerfile: services/api-gateway/Dockerfile
    container_name: ts-api-gateway
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:8080" # Acesso externo via porta 5000
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=tablesync_db;Username=admin;Password=secretpassword
      - Redis__ConnectionString=redis:6379
    networks:
      - tablesync-network

  # 5. Reservation Worker (.NET)
  reservation-worker:
    build:
      context: ../../
      dockerfile: services/reservation-worker/Dockerfile
    container_name: ts-reservation-worker
    depends_on:
      - rabbitmq
      - postgres
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=tablesync_db;Username=admin;Password=secretpassword
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    networks:
      - tablesync-network

volumes:
  postgres_data:

networks:
  tablesync-network:
    driver: bridge